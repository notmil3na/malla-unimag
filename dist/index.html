    <script>
      // Aplicar el tema guardado ANTES del primer pintado (evita el flash de tema
      // al recargar y sincroniza la barra de estado con el fondo real de la app).
      (function () {
        try {
          var THEMES = {
            ambar:     ["#EECE7B", "#D0783B", "238,206,123"],
            oceano:    ["#6BA3E8", "#3A70B0", "107,163,232"],
            violeta:   ["#B882E8", "#7B50B0", "184,130,232"],
            rosa:      ["#E87098", "#C04070", "232,112,152"],
            esmeralda: ["#6EC8A8", "#3A8B6A", "110,200,168"],
            coral:     ["#E8946B", "#C06840", "232,148,107"],
          };
          var s = JSON.parse(localStorage.getItem("malla_session") || "null");
          var r = document.documentElement;
          var mode = (s && s.appMode) || "dark";
          var c = THEMES[(s && s.appTheme)] || THEMES.ambar;
          r.setAttribute("data-theme", mode);
          r.style.setProperty("--accent", c[0]);
          r.style.setProperty("--accent2", c[1]);
          r.style.setProperty("--accent-rgb", c[2]);
          if (s && s.fontBody) r.style.setProperty("--font-body", "'" + s.fontBody + "', system-ui, sans-serif");
          // NOTA: no hay meta theme-color. En Safari iOS (pestaña normal) un
          // theme-color presente pinta la barra de estado con una banda sólida
          // opaca. Sin él, Safari muestrea el background-color del html/body y
          // fusiona sus barras con el fondo de la página (transparente al hacer
          // scroll / modo compacto).
        } catch (e) {}
      })();
    </script>
